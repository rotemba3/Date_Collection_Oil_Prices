# Runs every day: fetches the latest oil price via yfinance (no browser
# needed), combines it with whatever tweet CSVs are currently checked into
# the repo (combine_data.py), and pushes the result to MongoDB
# (sendtomongo.py).
#
# NOTE: Twitter scraping is currently NOT part of this workflow. twikit
# (the library main.py used to rely on) is broken upstream as of this
# writing. main.py, SearchScrapper.py, and WebDriverSetup.py have been
# restored to their original Selenium versions and are meant to be run
# BY HAND on your own machine (Selenium needs a real logged-in Chrome
# window, which GitHub Actions doesn't have). When you run main.py locally
# and git push the resulting CSVs under Data/Users_Timelines/ and
# combined_tweets.csv, the next run of this workflow will pick them up
# automatically — no other changes needed.

name: Scrape Daily

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily — cron is always UTC
  workflow_dispatch: {}    # lets you click "Run workflow" in the Actions tab to test

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest oil prices
        run: python app-back/OilDatafiles/fetch_oil_prices.py

      - name: Combine tweets + oil data
        run: python app-back/OilDatafiles/combine_data.py

      - name: Push combined data to MongoDB
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python app-back/OilDatafiles/sendtomongo.py
