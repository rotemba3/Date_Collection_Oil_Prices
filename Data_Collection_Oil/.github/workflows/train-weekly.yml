# Runs once a week: retrains the model on everything in MongoDB, and
# uploads the resulting files to your Hugging Face Hub repo so the daily
# prediction job can download and use them.

name: Train Weekly

on:
  schedule:
    - cron: "0 6 * * 0"   # 06:00 UTC every Sunday
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model and upload to Hugging Face Hub
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: python app-back/OilDatafiles/Trainmodel.py
